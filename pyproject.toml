[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-pentest"
version = "1.0.0"
description = "Argus - an LLM-driven agent for authorized web penetration testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["models.json",
         # The console is a data file, not a module: an install without it
         # serves a blank page from a working server, which is the worst
         # shape of missing - the operator sees a reachable port and a dead
         # UI with nothing saying why.
         "web/*.html",
         "skills/*.md", "team/roles/*.md",
         "resources/wordlists/*.txt",
         "resources/exploits/*/manifest.json",
         "resources/exploits/*/*.py"]
